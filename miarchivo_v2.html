<!DOCTYPE html>
<html>
<head>
    <title>Clase antes de vacaciones</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/picnic">

</head>
<body style="color: bisque;">
   <div id="contenedor">
     <div class="elemento"> Sección 1</div>
     <div class="elemento"> Sección 2</div>
     <div class="elemento"> Sección 3</div>
     <div class="elemento"> Sección 4</div>
      
   </div> 
   <button type="button" id="button1"> click(romeo) </button>
   <button type="button" id="button2"> click (maluma bio) </button>
   <button type="button" id="button3"> click (maluma img) </button>
   <button type="button" id="button4"> click (shakira img) </button>
   <button type="button" id="button5"> click (shakira bio) </button>
  <style >
    
   

  </style>
   
<script >
    let t = 1986;
    const c = 3.28;
    console.log(t);
    let p={"titulo": "Llano en llamas", "autor": "Juan Rulfo"};
    console.log(p.autor);
    let d= document.createElement("p");
    d.textContent="hola";
    document.getElementById("contenedor").appendChild(d);

    d.setAttribute("style","color:red");

    async function obtenerJSON() {
      const respuesta = await fetch ('archivo.json');
      const datos = await respuesta.json();
      console.log(datos);
      let d = document.createElement("p");
      d.textContent= datos.titulo;
      document.getElementById("contenedor").appendChild(d);
    }
    obtenerJSON();
    async function obtenerJSON2() {
      const respuesta = await fetch ('https://openlibrary.org/subjects/love.json?published_in=1500-1600');
      const datos = await respuesta.json();
      console.log(datos[0]);
      let d = document.createElement("p");
      d.textContent= datos.works[0].title;
      document.getElementById("contenedor").appendChild(d);
    }

    document.getElementById("button1").addEventListener("click",obtenerJSON2);

    async function obtenerJSON3() {
      const respuesta = await fetch ('https://www.theaudiodb.com/api/v1/json/123/search.php?s=maluma');
      const datos = await respuesta.json();
      console.log(datos[0]);
      let d = document.createElement("p");
      d.textContent= datos.artists[0].strBiography;
      document.getElementById("contenedor").appendChild(d);
      }
    document.getElementById("button2").addEventListener("click",obtenerJSON3);

    async function obtenerJSON4() {
      const respuesta = await fetch ('https://www.theaudiodb.com/api/v1/json/123/search.php?s=maluma');
      const datos = await respuesta.json();
      console.log(datos[0]);
      let i = document.createElement("img");
      i.src= datos.artists[0].strArtistFanart;
      i.setAttribute("width","800");
      document.getElementById("contenedor").appendChild(i);

      }
    document.getElementById("button3").addEventListener("click",obtenerJSON4);

    async function obtenerJSON5() {
      const respuesta = await fetch ('https://www.theaudiodb.com/api/v1/json/123/search.php?s=shakira');
      const datos = await respuesta.json();
      console.log(datos[0]);
      let i = document.createElement("img");
      i.src= datos.artists[0].strArtistFanart;
      i.setAttribute("width","800");
      document.getElementById("contenedor").appendChild(i);

      }
    document.getElementById("button4").addEventListener("click",obtenerJSON5);

    async function obtenerJSON6() {
      const respuesta = await fetch ('https://www.theaudiodb.com/api/v1/json/123/search.php?s=shakira');
      const datos = await respuesta.json();
      console.log(datos[0]);
      let d = document.createElement("p");
      d.textContent= datos.artists[0].strBiography;
      document.getElementById("contenedor").appendChild(d);
      }
    document.getElementById("button5").addEventListener("click",obtenerJSON6);
</script>



</body>
</html>
